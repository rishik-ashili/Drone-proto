[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gdnav"
version = "0.3.0"
description = "GPS-denied drone navigation: simulator, perception, navigation, safety and PX4 interfaces"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "opencv-python>=4.8", "pyyaml>=6.0", "onnxruntime>=1.16", "matplotlib>=3.7"]

[project.optional-dependencies]
train = ["ultralytics>=8.3", "onnx>=1.15", "onnxslim>=0.1.34"]
px4 = ["mavsdk>=2.0,<4"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["gdnav*"]

[tool.setuptools.package-data]
"gdnav.dashboard" = ["static/*", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
