# Phase 0 "hello waypoint": arm, take off, fly a 3 m x 4 m rectangle in the local
# frame via Offboard control, land. No landmarks needed.
name: hello_square
world: indoor_arena
frame: local_ned
altitude_m: 2.0
waypoints:
  - {id: 1, x: 3.0, y: 0.0, hold_s: 1}
  - {id: 2, x: 3.0, y: -4.0, hold_s: 1}
  - {id: 3, x: 0.0, y: -4.0, hold_s: 1}
  - {id: 4, x: 0.0, y: 0.0, hold_s: 1}
on_finish: land
